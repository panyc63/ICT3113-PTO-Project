services:
  ollama:
    image: ${A2_OLLAMA_IMAGE:-ollama/ollama:latest}
    pull_policy: never
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NO_CLOUD: "1"
      CUDA_VISIBLE_DEVICES: "-1"
      ROCR_VISIBLE_DEVICES: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ollama_storage:
    external: true
    name: ${A2_OLLAMA_VOLUME_NAME:-assignment1_ollama_storage}
