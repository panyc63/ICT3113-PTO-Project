services:
  triage-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-llama3.2:3b}
      MODEL_DIGEST: ${MODEL_DIGEST:-}
      RUN_ID: ${RUN_ID:-development}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-120}
      DB_PATH: /app/runtime/tickets.db
      LOG_PATH: /app/logs/${RUN_ID:-development}.jsonl
    volumes:
      - ./logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NO_CLOUD: "1"
      CUDA_VISIBLE_DEVICES: "-1"
      ROCR_VISIBLE_DEVICES: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  ollama_storage:
